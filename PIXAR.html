<!DOCTYPE html> 
<html lang="en"> 
<head>

    <title>PIXAR</title> 
<!-- Vinculación con el archivo de estilo CSS -->
    <link rel="stylesheet" href="style.css">

<!-- Código para letra Cinzel de Google Fonts -->    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="cabecera">
        <h1 class="title">PIXAR</h1>

            <a href="#">CAREERS</a>

    <!-- Caja Portada-->
    <div class="cajaportada">
        <img src="img/PORTADA-PIXAR.jpg" alt="PORTADA PIXAR">

            <img src="img/ARLO.jpg" alt="ARLO">
            <img src="img/UP.jpg" alt="UP">

        </div>
    </section>
